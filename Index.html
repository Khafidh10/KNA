<!DOCTYPE html>
<html>
<head>
  <title>Peta Sawah Desa</title>
  <meta charset="utf-8" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.3/dist/leaflet.css" />
  <style>
    #map { height: 100vh; margin: 0; padding: 0; }
    body { margin: 0; }
  </style>
</head>
<body>
  <div id="map"></div>
  <script src="https://unpkg.com/leaflet@1.9.3/dist/leaflet.js"></script>
  <script>
    // Inisialisasi peta
    var map = L.map('map').setView([-7.7896, 110.3635], 15);

    // Tambahkan peta dasar (OpenStreetMap)
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      attribution: '© OpenStreetMap'
    }).addTo(map);

    // Tambahkan marker sawah
    L.marker([-7.7896, 110.3635]).addTo(map)
      .bindPopup("<b>Sawah Pak Budi</b><br>Padi")
      .openPopup();
  </script>
</body>
</html>
